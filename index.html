            photos: ["img/box-5/photo-2.jpg"],
            videoFile: "img/box-5/video.mp4", poster: "img/box-5/poster.jpg" },
        { id: "box-6", emoji: "🪆", name: "Бокс 6", price: "2 000 ₽", items: [
            candle("Матрешка"), "Крем для рук", "Открытка", "Сосновая веточка (искусственная)"],
            cover: "img/box-6/cover.jpg",
            photos: ["img/box-6/photo-2.jpg"],
            videoFile: "img/box-6/video.mp4", poster: "img/box-6/poster.jpg" },
        { id: "box-7", emoji: "🐑", name: "Бокс 7", price: "2 500 ₽", items: [
            candle("Барашек"), "Коробочка с конфетами", "Открытка", "Фруктовый чай", "Сосновая веточка (искусственная)"],
            cover: "img/box-7/cover.jpg",
            photos: ["img/box-7/photo-2.jpg"],
            videoFile: "img/box-7/video.mp4", poster: "img/box-7/poster.jpg" },
        { id: "box-8", emoji: "❄️", name: "Бокс 8", price: "2 500 ₽", items: [
            candle("Снежинка"), "Крем для рук", "Открытка", "Коробочка с конфетами", "Сосновая веточка (искусственная)"],
            cover: "img/box-8/cover.jpg",
            photos: ["img/box-8/photo-2.jpg"],
            videoFile: "img/box-8/video.mp4", poster: "img/box-8/poster.jpg" }
    ];

    var app = document.getElementById("app");

    function landing() {
        var imgs = PHOTOS.concat(PHOTOS, PHOTOS, PHOTOS).map(function (p, i) {
            var first = i < PHOTOS.length;
            return '<img src="' + p + '" width="450" height="800" decoding="async" alt="' + (first ? "Новогодний подарок" : "") + '"' + (first ? "" : ' aria-hidden="true"') + '>';
        }).join("");
        return '<section class="hero reveal"><h1 class="bigtitle"><span class="bt-main">Где купить<br>подарки</span><span class="bt-script">в Магадане</span></h1>' +
            '<p class="lead reveal" style="animation-delay: 0.3s">Не знаете, что подарить коллегам, друзьям или близким на Новый год?</p>' +
            '<p class="lead reveal" style="animation-delay: 0.6s">Мы создали для вас подборку прекрасных вариантов подарков. Наши идеи не оставят равнодушными ваших близких и помогут вам сэкономить время в поисках.</p>' +
            '<a class="btn big" href="#catalog">Подарки <span class="arrow">→</span></a></section>' +
            '<div class="reel reveal" style="animation-delay: 1.1s"><div class="reel-track">' + imgs + '</div></div>';
    }

    function catalog() {
        var cards = GIFTS.map(function (g, n) {
            var photo = g.cover
                ? '<div class="photo has"><img src="' + g.cover + '" alt="' + g.name + '" loading="lazy"></div>'
                : '<div class="photo">' + g.emoji + '</div>';
            var inner = photo +
                '<div class="body"><h3>' + g.name + '</h3>' + (g.sub ? '<div class="sub">' + g.sub + '</div>' : '') +
                '<div class="price">' + g.price + '</div>' +
                (g.soon ? '' : '<div class="more">Состав и видеообзор →</div>') + '</div>';
            var delay = 'style="animation-delay:' + (0.15 * n + 0.2) + 's"';
            return g.soon
                ? '<div class="card soon reveal" ' + delay + '>' + inner + '</div>'
                : '<a class="card reveal" ' + delay + ' href="#' + g.id + '">' + inner + '</a>';
        }).join("");
        return '<section class="hero reveal"><h1>Подарки</h1>' +
            '<span class="badge">Ноябрь: скидка 10% на все подарки</span></section>' +
            '<div class="grid">' + cards + '</div>';
    }

    function gift(g) {
        var list = g.items.map(function (i) { return "<li>" + i + "</li>"; }).join("");
        var photos = (g.cover ? [g.cover] : []).concat(g.photos || []);
        var left;
        if (photos.length) {
            var thumbs = photos.length > 1 ? '<div class="thumbs" style="--n:' + photos.length + '">' + photos.map(function (p, i) {
                return '<button type="button" class="thumb' + (i === 0 ? " on" : "") + '" data-photo="' + p + '" aria-label="Фото ' + (i + 1) + '"><img src="' + p + '" alt="" loading="lazy"></button>';
            }).join("") + '</div>' : "";
            left = '<div class="gallery"><img id="gmain" class="gmain" src="' + photos[0] + '" alt="' + g.name + '">' + thumbs + '</div>';
        } else {
            left = '<div class="photo">' + g.emoji + '</div>';
        }
        var video;
        if (g.videoFile) {
            video = '<h3 class="vhead">Видеообзор</h3><div class="video has"><video controls playsinline preload="metadata" width="720" height="1566"' +
                (g.poster ? ' poster="' + g.poster + '"' : "") + '><source src="' + g.videoFile + '" type="video/mp4"></video></div>';
        } else if (g.video) {
            video = '<h3 class="vhead">Видеообзор</h3><div class="video"><iframe src="' + g.video + '" title="Видеообзор: ' + g.name + '" loading="lazy" allowfullscreen></iframe></div>';
        } else {
            video = '<div class="video">Здесь будет видеообзор подарка</div>';
        }
        return '<a class="back" href="#catalog">← Все подарки</a>' +
            '<div class="gift reveal">' + left +
            '<div><h2>' + g.name + '</h2>' + (g.sub ? '<div class="sub">' + g.sub + '</div>' : '') + '<div class="price">' + g.price + '</div>' +
            (g.desc ? '<p class="desc">' + g.desc + '</p>' : '') + '<h3>Состав</h3><ul>' + list + '</ul>' +
            '<div class="buy"><a class="btn" href="' + ORDER_LINK + '" target="_blank" rel="noopener">Заказать</a>' +
            '<a class="link" href="#info">Оплата и доставка</a></div></div></div>' + video;
    }

    function info() {
        return '<div class="info reveal"><h2>Дополнительная информация</h2>' +
            '<h3>Оплата</h3><p>Оплата осуществляется по реквизитам карты. Предоплата фиксированная — 500 ₽. Остаток суммы оплачивается в день доставки, перед получением.</p>' +
            '<h3>Доставка</h3><p>Выдача заказов осуществляется с 15.12 по 30.12. Если подарок нужен раньше, обязательно предупредите заранее. Заказ можно забрать самостоятельно или оформить доставку. Доставка по городу — 150 ₽. Если нужна доставка за пределы города, условия и стоимость обсуждаются индивидуально: <a href="' + ORDER_LINK + '" target="_blank" rel="noopener">напишите нам в Telegram</a>, и мы подберём удобный вариант.</p>' +
            '<h3>Акции</h3><p>До конца ноября действует скидка 10% на все подарки.<br>При покупке на сумму более 10 000 ₽ доставка бесплатная.</p>' +
            '<h3>Сертификат в подарок</h3><p>Если вам покажется, что подарка недостаточно, вы можете добавить в него сертификат в любимый магазин человека. Тогда подарок станет не только эстетически красивым, но и добавит масштаб и практическую ценность.</p></div>';
    }

    function route() {
        var h = location.hash.replace("#", "") || "home";
        var g = GIFTS.filter(function (x) { return x.id === h && !x.soon; })[0];
        var page = g ? gift(g) : (h === "info" ? info() : (h === "catalog" ? catalog() : landing()));
        app.innerHTML = page;
        var tab = g ? "catalog" : (h === "info" || h === "catalog" ? h : "home");
        ["home", "catalog", "info"].forEach(function (t) {
            document.getElementById("n-" + t).className = (t === tab) ? "on" : "";
        });
        window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    }
    app.addEventListener("click", function (e) {
        var main = document.getElementById("gmain");
        if (!main) return;
        var t = e.target.closest ? e.target.closest("[data-photo]") : null;
        if (!t && e.target === main) {
            // клик по большому фото — следующее фото
            var all = app.querySelectorAll(".thumb");
            for (var i = 0; i < all.length; i++) {
                if (all[i].className.indexOf("on") > -1) { t = all[(i + 1) % all.length]; break; }
            }
        }
        if (!t) return;
        main.src = t.getAttribute("data-photo");
        var th = app.querySelectorAll(".thumb");
        for (var j = 0; j < th.length; j++) th[j].className = "thumb" + (th[j] === t ? " on" : "");
    });
    window.addEventListener("hashchange", route);
    route();

</script>
</body>
</html>
