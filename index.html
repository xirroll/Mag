<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a0f1b">
<title>Новогодние подарки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Fira+Sans+Condensed:wght@400;500&family=Inter:wght@800&family=Tenor+Sans&family=Great+Vibes&family=Marck+Script&display=swap">
<style>
    :root {
        --bg: #4a0f1b;
        --bg-deep: #2e0911;
        --card: #5a1425;
        --text: #c9cbce;
        --ivory: #939597;
        --muted: #a2a4a7;
        --gold: #b4b6b9;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family: "Fira Sans Condensed", "Arial Narrow", Arial, sans-serif;
        font-size: 17px;
        line-height: 1.5;
    }
    .frame {
        position: relative;
        margin: 14px;
        border: 2px solid var(--ivory);
        box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 7px rgba(147, 149, 151, 0.45);
        min-height: calc(100vh - 28px);
        padding: 28px 20px 40px;
    }
    .wrap { max-width: 980px; margin: 0 auto; position: relative; z-index: 1; }
    h1, h2, h3 {
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0;
    }
    h1 { font-size: clamp(30px, 6vw, 54px); line-height: 1.1; }
    h2 { font-size: clamp(24px, 4vw, 36px); }
    nav {
        display: flex;
        justify-content: center;
        gap: 22px;
        margin-bottom: 30px;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }
    nav a { color: var(--muted); text-decoration: none; padding-bottom: 3px; border-bottom: 1px solid transparent; }
    nav a.on, nav a:hover { color: var(--text); border-color: var(--gold); }
    .hero { text-align: center; padding: 20px 0 36px; }
    .hero p { max-width: 560px; margin: 18px auto 0; color: var(--muted); }
    .badge {
        display: inline-block;
        margin-top: 22px;
        padding: 8px 18px;
        border: 1px solid var(--gold);
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
    .card {
        display: block;
        color: inherit;
        text-decoration: none;
        background: var(--card);
        border: 1px solid rgba(147, 149, 151, 0.25);
        transition: transform 0.25s, border-color 0.25s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .photo {
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        background: linear-gradient(135deg, #6e1a2c, #2e0911);
        border-bottom: 1px solid rgba(147, 149, 151, 0.25);
    }
    .card .body { padding: 16px 18px 20px; }
    .card h3 { font-size: 24px; }
    .price { color: var(--gold); font-size: 22px; margin-top: 6px; }
    .more { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .back { display: inline-block; margin-bottom: 20px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); }
    .gift { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .gift .photo { aspect-ratio: 1; font-size: 110px; border: 1px solid rgba(147, 149, 151, 0.25); }
    .gift ul { padding-left: 20px; margin: 12px 0 22px; }
    .gift li { margin-bottom: 4px; }
    .gift .price { font-size: 30px; margin: 10px 0 18px; }
    .video {
        margin-top: 28px;
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: var(--bg-deep);
        border: 1px dashed var(--gold);
        color: var(--muted);
        padding: 20px;
    }
    .video iframe { width: 100%; height: 100%; border: 0; }
    .btn {
        display: inline-block;
        background: var(--text);
        color: var(--bg);
        padding: 13px 30px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 500;
    }
    .btn:hover { background: var(--gold); }
    .info { max-width: 640px; margin: 0 auto; }
    .info h2 { text-align: center; margin-bottom: 26px; }
    .info h3 { font-size: 22px; text-align: center; margin: 30px 0 10px; color: var(--gold); }
    .info p { margin: 0 0 8px; }
    .covers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .covers .photo { aspect-ratio: 1; font-size: 36px; }
    footer { text-align: center; margin-top: 44px; color: var(--muted); font-size: 14px; }
    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .snow i {
        position: absolute;
        top: -10px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.6;
        animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(105vh) translateX(30px); } }
    .reveal { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    .hero h1 {
        background: linear-gradient(100deg, var(--text) 30%, #fff 45%, var(--gold) 55%, var(--text) 70%);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 6s linear infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    .gift .photo { animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .lights { position: absolute; top: -8px; left: 90px; right: 90px; display: flex; justify-content: space-between; z-index: 2; pointer-events: none; }
    .lights i {
        width: 10px;
        height: 14px;
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        background: var(--c);
        box-shadow: 0 0 10px 2px var(--c);
        animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle { 50% { opacity: 0.3; } }
    .cane { position: absolute; top: -12px; width: 46px; z-index: 2; pointer-events: none; transform-origin: 50% 15%; animation: sway 5s ease-in-out infinite; }
    .cane svg { display: block; width: 100%; height: auto; }
    .cane.l { left: 30px; }
    .cane.r { right: 30px; animation-delay: -2.5s; }
    .cane.r svg { transform: scaleX(-1); }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .orn { position: absolute; top: 0; width: 2px; background: var(--ivory); transform-origin: 50% 0; z-index: 1; pointer-events: none; animation: sway 4s ease-in-out infinite; }
    .orn::after {
        content: "";
        position: absolute;
        bottom: -22px;
        left: -11px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.7) 0, transparent 30%), var(--b);
        box-shadow: inset -4px -4px 8px rgba(0, 0, 0, 0.3);
    }
    .hero p.lead {
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        font-size: clamp(16px, 2.1vw, 20px);
        line-height: 1.2;
        color: var(--text);
        max-width: 340px;
        text-wrap: balance;
        margin: 22px auto 0;
    }
    .btn.big {
        margin-top: 30px;
        padding: 16px 48px;
        font-size: 18px;
        animation: rise 0.8s both 0.9s, pulse 2.4s ease-out infinite 1.8s;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(147, 149, 151, 0.55); }
        70%, 100% { box-shadow: 0 0 0 18px rgba(147, 149, 151, 0); }
    }
    .reel {
        overflow: hidden;
        margin: 40px -20px 0;
        padding: 14px 0;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }
    .reel-track { display: flex; align-items: flex-start; width: max-content; animation: scroll 80s linear infinite; }
    .reel:hover .reel-track { animation-play-state: paused; }
    .reel img {
        flex: none;
        height: 380px;
        width: auto;
        padding: 6px;
        border: 1px solid var(--ivory);
        background: rgba(147, 149, 151, 0.08);
    }
    .reel img:nth-child(even) { margin-top: 26px; }
    @keyframes scroll { to { transform: translateX(-50%); } }
    .note { max-width: 620px; margin: 34px auto 0; text-align: center; color: var(--muted); font-size: 15px; font-style: italic; }
    .covers img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid rgba(147, 149, 151, 0.25); }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 720px) { .reel img { height: 270px; } }
    h1, h2, h3 { font-weight: 600; }
    .card { border-radius: 22px; overflow: hidden; background: rgba(147, 149, 151, 0.04); border: 1.5px solid rgba(147, 149, 151, 0.6); }
    .gift .photo, .video { border-radius: 20px; }
    .covers img { border-radius: 14px; }
    .reel img { border-radius: 18px; margin-right: 16px; }
    .badge, .btn { border-radius: 999px; }
    .btn.big {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 18px 56px;
        font-size: 19px;
        background: linear-gradient(135deg, #e6e7e9, #a7a9ac);
        color: #4a0f1b;
        transition: transform 0.25s;
    }
    .btn.big::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -60%;
        width: 40%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.7), transparent);
        transform: skewX(-20deg);
        animation: glint 3.2s ease-in-out infinite 2s;
    }
    .btn.big .arrow { display: inline-block; transition: transform 0.3s; }
    .btn.big:hover { transform: translateY(-2px) scale(1.04); }
    .btn.big:hover .arrow { transform: translateX(7px); }
    @keyframes glint { 0% { left: -60%; } 40%, 100% { left: 130%; } }
    html {
        background: radial-gradient(ellipse at 50% 0%, #5c1424 0%, #4a0f1b 55%, #2e0911 100%) fixed;
        background-color: #4a0f1b;
        overscroll-behavior: none;
    }
    h1, h2, h3 { font-family: "Tenor Sans", "Cormorant Garamond", Georgia, serif; font-weight: 400; }
    nav { font-family: "Tenor Sans", "Fira Sans Condensed", Arial, sans-serif; letter-spacing: 0.14em; }
    .price { font-family: "Tenor Sans", Georgia, serif; }
    .btn { font-family: "Tenor Sans", "Fira Sans Condensed", Arial, sans-serif; font-weight: 400; font-size: 14px; letter-spacing: 0.16em; }
    .btn.big { font-size: 18px; }
    .hero h1.bigtitle {
        position: relative;
        display: inline-block;
        background: none;
        color: var(--text);
        animation: none;
        font-family: "Inter", "Arial Black", Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        line-height: 1;
        font-size: clamp(40px, 9vw, 92px);
        margin-bottom: 8px;
    }
    .bt-main {
        display: inline-block;
        background: linear-gradient(100deg, var(--text) 30%, #fff 45%, var(--gold) 55%, var(--text) 70%);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 6s linear infinite;
    }
    .bt-script {
        position: absolute;
        left: 50%;
        top: 54%;
        transform: translate(-50%, -50%) rotate(-5deg);
        font-family: "Great Vibes", "Marck Script", cursive;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.8em;
        white-space: nowrap;
        color: #a9bfe8;
        text-shadow: -2px -2px 0 #2e0911, 2px -2px 0 #2e0911, -2px 2px 0 #2e0911, 2px 2px 0 #2e0911, 0 3px 14px rgba(0, 0, 0, 0.5);
    }
    @keyframes write {
        from { clip-path: inset(-40% 100% -40% -10%); }
        to { clip-path: inset(-40% -10% -40% -10%); }
    }
    @media (prefers-reduced-motion: reduce) { .snow { display: none; } * { animation: none !important; } }
    @media (max-width: 720px) {
        .gift { grid-template-columns: 1fr; }
        .frame { margin: 8px; padding: 22px 14px 32px; }
        .cane { width: 32px; }
        .cane.l { left: 14px; }
        .cane.r { right: 14px; }
        .lights { left: 56px; right: 56px; }
    }
</style>
</head>
<body>
<div class="frame">
    <div class="wrap">
        <nav>
            <a href="#home" id="n-home">Главная</a>
            <a href="#catalog" id="n-catalog">Подарки</a>
            <a href="#info" id="n-info">Информация</a>
        </nav>
        <main id="app"></main>
        <footer>
            <div>Юлия · <a href="https://t.me/julia_sanko" target="_blank" rel="noopener">Telegram @julia_sanko</a> · <a href="tel:+79826576914">+7 982 657-69-14</a></div>
            <div style="margin-top: 6px">С наступающим Новым годом! ✦</div>
        </footer>
    </div>
</div>

<script>
    // ДАННЫЕ: здесь меняем подарки, фото и контакты
    var ORDER_LINK = "https://t.me/julia_sanko";
    var PHOTOS = ["img/photo-1.jpg", "img/photo-2.jpg", "img/photo-3.jpg", "img/photo-4.jpg", "img/photo-5.jpg"];
    var GIFTS = [
        { id: "gift-1", emoji: "🎁", name: "Подарок 1", price: "Цена", desc: "Описание подарка появится позже.", items: ["Состав появится позже"], video: "" },
        { id: "gift-2", emoji: "🎄", name: "Подарок 2", price: "Цена", desc: "Описание подарка появится позже.", items: ["Состав появится позже"], video: "" },
        { id: "gift-3", emoji: "✨", name: "Подарок 3", price: "Цена", desc: "Описание подарка появится позже.", items: ["Состав появится позже"], video: "" }
    ];

    var app = document.getElementById("app");

    function landing() {
        var imgs = PHOTOS.concat(PHOTOS, PHOTOS, PHOTOS).map(function (p) {
            return '<img src="' + p + '" alt="Новогодний подарок">';
        }).join("");
        return '<section class="hero reveal"><h1 class="bigtitle"><span class="bt-main">Где купить<br>подарки</span><span class="bt-script">в Магадане</span></h1>' +
            '<p class="lead reveal" style="animation-delay: 0.3s">Не знаете, что подарить коллегам, друзьям или близким на Новый год?</p>' +
            '<p class="lead reveal" style="animation-delay: 0.6s">Мы создали для вас подборку прекрасных вариантов подарков. Наши идеи не оставят равнодушными ваших близких и помогут вам сэкономить время в поисках.</p>' +
            '<a class="btn big" href="#catalog">Подарки <span class="arrow">→</span></a></section>' +
            '<div class="reel reveal" style="animation-delay: 1.1s"><div class="reel-track">' + imgs + '</div></div>' +
            '<p class="note">*Если вам покажется, что подарка недостаточно, вы можете добавить в него сертификат в любимый магазин человека. Тогда подарок станет не только эстетически красивым, но и добавит масштаб и практическую ценность.</p>';
    }

    function catalog() {
        var cards = GIFTS.map(function (g, n) {
            return '<a class="card reveal" style="animation-delay:' + (0.15 * n + 0.2) + 's" href="#' + g.id + '">' +
                '<div class="photo">' + g.emoji + '</div>' +
                '<div class="body"><h3>' + g.name + '</h3>' +
                '<div class="price">' + g.price + '</div>' +
                '<div class="more">Состав и видеообзор →</div></div></a>';
        }).join("");
        return '<section class="hero reveal"><h1>Подарки</h1>' +
            '<span class="badge">Ноябрь: скидка 10% на все подарки</span></section>' +
            '<div class="grid">' + cards + '</div>';
    }

    function gift(g) {
        var list = g.items.map(function (i) { return "<li>" + i + "</li>"; }).join("");
        var video = g.video
            ? '<iframe src="' + g.video + '" allowfullscreen></iframe>'
            : "Здесь будет видеообзор подарка";
        return '<a class="back" href="#catalog">← Все подарки</a>' +
            '<div class="gift reveal"><div class="photo">' + g.emoji + '</div>' +
            '<div><h2>' + g.name + '</h2><div class="price">' + g.price + '</div>' +
            '<p>' + g.desc + '</p><h3>Состав</h3><ul>' + list + '</ul>' +
            '<a class="btn" href="' + ORDER_LINK + '" target="_blank" rel="noopener">Заказать</a></div></div>' +
            '<div class="video">' + video + '</div>';
    }

    function info() {
        return '<div class="info reveal"><h2>Дополнительная информация</h2>' +
            '<div class="covers">' + [[0, "50% 50%"], [1, "50% 88%"], [2, "50% 100%"]].map(function (c) { return '<img src="' + PHOTOS[c[0]] + '" style="object-position: ' + c[1] + '" alt="">'; }).join("") + '</div>' +
            '<h3>Оплата</h3><p>Оплата осуществляется по реквизитам карты. Предоплата фиксированная — 500 ₽. Остаток суммы оплачивается в день доставки, перед получением.</p>' +
            '<h3>Доставка</h3><p>Выдача заказов осуществляется с 15.12 по 30.12. Если вам подарок нужен раньше, обязательно предупредите. Заказ можно забрать самостоятельно либо оформить доставку. Доставка осуществляется в пределах города. Цена доставки — 150 ₽.</p>' +
            '<h3>Акции</h3><p>— При покупке более 3-х подарков — скидка 5%;<br>— При покупке более 10-ти подарков — скидка 10%;<br>— При покупке на сумму более 10 000 ₽ — доставка бесплатно.</p>' +
            '<p style="margin-top:14px">Акция ноября: при заказе с 1.11 по 30.11 действует скидка 10% на все подарки.</p>' +
            '<p style="margin-top:14px;color:var(--muted);font-size:15px">Если вам покажется, что подарка недостаточно, вы можете добавить в него сертификат в любимый магазин человека.</p></div>';
    }

    function route() {
        var h = location.hash.replace("#", "") || "home";
        var g = GIFTS.filter(function (x) { return x.id === h; })[0];
        var page = g ? gift(g) : (h === "info" ? info() : (h === "catalog" ? catalog() : landing()));
        app.innerHTML = page;
        var tab = g ? "catalog" : (h === "info" || h === "catalog" ? h : "home");
        ["home", "catalog", "info"].forEach(function (t) {
            document.getElementById("n-" + t).className = (t === tab) ? "on" : "";
        });
        window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", route);
    route();

</script>
</body>
</html>
